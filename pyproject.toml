[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novaretail-supplychain"
version = "0.1.0"
description = "AI-powered supply chain disruption management platform for NovaRetail Group"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.0,<2",
    "langchain-core>=1.5.0,<2",
    "langgraph>=1.2.0,<2",
    "langgraph-checkpoint>=4.1.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langchain-google-genai>=4.3.0,<5",
    "langsmith>=0.10.0",
    "streamlit>=1.60.0",
    "pydantic>=2.13.0",
    "python-dotenv>=1.2.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
supplychain = ["data/mock/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
