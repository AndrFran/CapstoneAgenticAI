<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- NovaRetail Control Tower mark: a container on a lane.
       Local on purpose - `page_icon=":material/...:"` resolves to a
       fonts.gstatic.com URL, so the tab icon would fail with no network. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E93DE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <rect x="14" y="20" width="36" height="20" rx="3" fill="#FFFFFF" opacity="0.95"/>
  <g fill="#0A1220" opacity="0.55">
    <rect x="19" y="23" width="2.5" height="14"/>
    <rect x="26" y="23" width="2.5" height="14"/>
    <rect x="33" y="23" width="2.5" height="14"/>
    <rect x="40" y="23" width="2.5" height="14"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="22" cy="47" r="4"/>
    <circle cx="42" cy="47" r="4"/>
    <rect x="12" y="45.2" width="40" height="3.2" rx="1.6" opacity="0.5"/>
  </g>
</svg>
