# NovaRetail Ops Assistant - the "freight console" theme.
#
# Owner: Team Member 1 (chat UI). Two rules this file encodes, both of which
# the app depends on:
#
#   1. The accent is deliberately cool (sky blue). Warm colours mean something
#      here - red/orange/yellow/green are incident severity - so they are never
#      spent on decoration. Anything that is merely "the brand" is blue.
#   2. Light and dark are both defined, so the in-app theme toggle works. The
#      sidebar stays dark navy in *both*, because it is the brand rail; that is
#      why the sidebar sections repeat the dark alert palette.
#
# Everything else lives in src/supplychain/ui/theme.py as CSS.

[theme]
base = "dark"
font = "Inter, 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif"
headingFont = "Inter, 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif"
codeFont = "'JetBrains Mono', 'Cascadia Code', ui-monospace, Consolas, monospace"
baseFontSize = 15
baseRadius = "0.7rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false
chartCategoricalColors = [
    "#38BDF8", "#34D399", "#FBBF24", "#F87171",
    "#A78BFA", "#22D3EE", "#FB923C", "#94A3B8",
]

